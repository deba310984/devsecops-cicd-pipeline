name: DevSecOps Pipeline

# Build + test is a hard gate. Security scanners run in parallel and publish
# their reports as build artifacts. Early-stage scans are report-only (they do
# not block the build on findings) except secret detection, which is a gate —
# a leaked credential should always stop the pipeline.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B clean verify
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: pipx install semgrep || pip install semgrep
      - name: Static analysis (report-only)
        run: semgrep scan --config p/java --config p/secrets --sarif --output semgrep.sarif || true
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore

  secret-scan:
    name: Secret Scan (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            dir /repo --redact --verbose

  dependency-scan:
    name: Dependency & Filesystem Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Scan filesystem (report-only)
        run: |
          trivy fs --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --exit-code 0 \
            --format table --output trivy-fs.txt .
          echo "----- Trivy filesystem report -----"; cat trivy-fs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs.txt

  iac-scan:
    name: IaC Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Checkov
        run: pip install checkov
      - name: Scan Terraform (soft fail)
        run: checkov -d infra --soft-fail --compact

  image-scan:
    name: Image Build & Scan (Trivy + SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (multi-stage)
        run: docker build -t devsecops-app:${{ github.sha }} .
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Scan image (report-only)
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 \
            --format table --output trivy-image.txt devsecops-app:${{ github.sha }}
          echo "----- Trivy image report -----"; cat trivy-image.txt
      - name: Generate SBOM (Syft)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
          syft devsecops-app:${{ github.sha }} -o spdx-json=sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-scan-and-sbom
          path: |
            trivy-image.txt
            sbom.spdx.json
